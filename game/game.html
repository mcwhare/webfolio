<!DOCTYPE html>
<html>
    <head>
        <title>Key presser</title>
        <link rel="stylesheet" href="gamestyle.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#socials">Contact</a>
        </nav>


        <h1>Key Presser</h1>
        <div class="game-container">

            <div id="points-display">0</div>

            <br>

            <div id = "keys-container">
                <img src="gameassets/Q.png" class="key" id="key-q" data-key="q">
                <img src="gameassets/lock.png" class="key locked" id="key-w" data-key="w">
                <img src="gameassets/lock.png" class="key locked" id="key-e" data-key="e">
                <img src="gameassets/lock.png" class="key locked" id="key-a" data-key="a">
            </div>

            <!--button upgrades-->
            <div class="upgrades-container">
                <button class="upgrade-button" id="upgrade-Q" >
                    <div class="left">Q</div>
                    <div class="center">
                        <div class="title">Press Q to ult</div>
                        <div class="subtitle" id="sub-q">Generates 1p per press</div>
                        <hr>
                        <div class="details">
                            <div id="cost-q">Upgrade cost: 10</div>
                            <div id="change-q">1p -> 2p</div>
                        </div>
                    </div>
                    <div class="right" id="level-q">x1</div>
                </button>

                <br>
                <button class="upgrade-button locked" id="upgrade-W" >
                    <div class="left">W</div>
                    <div class="center">
                        <div class="title">Holding W</div>
                        <div class="subtitle" id="sub-w">Generates 5p per press.</div>
                        <hr>
                        <div class="details">
                            <div id="cost-w">Unlock cost: 20</div>
                            <div id="change-w">5p</div>
                        </div>
                    </div>
                    <div class="right" id="level-w">x1</div>
                </button>
                <br>

                <button class="upgrade-button locked" id="upgrade-E" >
                    <div class="left">E</div>
                    <div class="center">
                        <div class="title">These fingers are E for everyone</div>
                        <div class="subtitle">Presses all keys at once.</div>
                        <div class="subtitle" id="sub-e"></div>
                        <div class="subtitle" id="cooldown-e">2s cooldown per unlocked key.</div>
                        <hr>
                        <div class="details">
                            <div id="cost-e">Unlock cost: 200</div>
                            <div id="change-e">2s -> 1.8s</div>
                        </div>
                    </div>
                    <div class="right" id="level-e">x1</div>
                </button>
                <br>

                <button class="upgrade-button" id="upgrade-A" >
                    <div class="left">A</div>
                    <div class="center">
                        <div class="title">Addicted to Gambling</div>
                        <div class="subtitle" id="sub-a">Gamble. Either +200p or -200p each press.</div>
                        <hr>
                        <div class="details">
                            <div id="cost-a">Unlock cost: 1000</div>
                            <div id="change-a">200p -> 224p</div>
                        </div>
                    </div>
                    <div class="right" id="level-a">x1</div>
                </button>


            </div>


        </div>
    <script src="gamescript.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Key presser</title>
        <link rel="stylesheet" href="gamestyle.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#socials">Contact</a>
        </nav>


        <h1>Key presser</h1>
        <div class="game-container">

            <div id="points-display">0</div>

            <br>

            <div id = "keys-container">
                <img src="gameassets/Q.png" class="key" id="key-q" data-key="q">
                <img src="gameassets/lock.png" class="key locked" id="key-w" data-key="w">
            </div>

            <div class="upgrades-container">

                <button class="upgrade-button" id="upgrade-Q" >
                    <div class="left">Q</div>
                    <div class="center">
                        <div class="title">Press Q to ult</div>
                        <div class="subtitle" id="sub-q">Generates 1p per press</div>
                        <hr>
                        <div class="details">
                            <div id="cost-q">Upgrade cost: 10</div>
                            <div id="change-q">1p -> 2p</div>
                        </div>
                    </div>
                    <div class="right" id="level-q">x1</div>
                </button>
                <br>
                <button class="upgrade-button locked" id="upgrade-W" >
                    <div class="left">W</div>
                    <div class="center">
                        <div class="title">Wet like water</div>
                        <div class="subtitle" id="sub-w">Generates 5p per press. Can be held down</div>
                        <hr>
                        <div class="details">
                            <div id="cost-w">Unlock cost: 20</div>
                            <div id="change-w">5p</div>
                        </div>
                    </div>
                    <div class="right" id="level-w">x1</div>
                </button>


            <!-- Add more upgrade buttons here as needed -->
            </div>


        </div>
    <script src="gamescript.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mcwh</title>
        <link rel="stylesheet" href="css/misc.css" />
<!--        <script src="scripts/scripts.js"></script>-->

    </head>
    <script>
        function openOverlay(selected) {
            const overlay = document.getElementById('overlay');
            const overlayContent = document.getElementById('overlayContent')
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling

            overlayContent.innerHTML = `

        ${selected.dataset.caption ? `<div class="overlay-caption">${selected.dataset.caption}</div>` : ''}<img src="${selected.src}" class="overlay-image">
    `;

            overlay.focus();
        }

        function closeOverlay() {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto'; // Re-enable scrolling

            // Reset zoom if applied
            const img = overlay.querySelector('.overlay-image');
            img.classList.remove('zoom');
        }

        // Add keyboard support
        document.addEventListener('keydown', function(e) {
            const overlay = document.getElementById('overlay');
            if (e.key === 'Escape' && overlay.style.display === 'block') {
                closeOverlay();
            }
        });
    </script>

    <body>

    <!-- Navbar -->
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#socials">Contact</a>
        </nav>

      <!-- Hero Section -->
      <header class="hero">
        <div class="hero-text">
          <h1>Miscellaneous projects</h1>
        </div>
      </header>

            <!-- Main Content -->
        <main class="content-grid">

            <section id="image" class="card">
                <img src="misc-images/Carhook.png" loading="lazy"
                 data-caption="Carhook. A fake product that I 3D modelled and printed."
                 overlay-image="image" onclick="openOverlay(this)">
            </section>



            <div id="overlay" class="overlay" onclick="closeOverlay()">
              <div class="overlay-container" onclick="event.stopPropagation()">
                <div class="overlay-content" id="overlayContent"></div>
                <button class="close-btn" onclick="closeOverlay()">&times;</button>
              </div>
            </div>

        </main>
        <footer class="footer">
            <div class="footer-content">

            </div>
        </footer>


    </body>
</html>
